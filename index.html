<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Deployment</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0d1117; 
            color: #c9d1d9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            text-align: center; 
            background-color: #161b22; 
            padding: 50px; 
            border-radius: 12px; 
            border: 1px solid #30363d; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.5); 
        }
        h1 { color: #58a6ff; margin-bottom: 10px; }
        p { font-size: 1.2em; color: #8b949e; }
        .badge { 
            display: inline-block; 
            margin-top: 20px; 
            padding: 8px 16px; 
            background-color: #238636; 
            color: #ffffff; 
            border-radius: 20px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DevOps Task Complete!</h1>
        <p>Task 3: Git & GitHub Deployment</p>
        <div class="badge">✅ Live on GitHub Pages</div>
    </div>
</body>
</html>
